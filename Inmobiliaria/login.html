<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inmobiliaria</title>

    <style>
        
        body{
            margin: 0%;
            display: flex;
            flex-direction: column;

            position: relative;
            overflow: hidden;
            
        }

        /*
        BEFORE genera una "capa" debajo de todos los elementos
        Esto es solo para generar el efecto de desenfoque del fondo
        */
        body::before{
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;

            background-image: url("ciudad.jpeg");
            background-size: cover;
            background-position: center;

            filter: blur(8px);
            z-index: -1;        /* Se queda detras del todo*/
        }

        h1{
            position: sticky;
            top: 0;

            text-align: center;
            margin: 0%;
            padding: 10px;
            background-color: rgb(247, 201, 146);

            font-family:Arial, Helvetica, sans-serif;
            letter-spacing: 5px;
        }

        #formulario{
            display: flex;
            flex-direction: column;

            margin-top: 10%;
            padding: 20px;
            border-radius: 20px;
            max-width: 50%;
            min-width: 50%;
            justify-content: center;
            align-self: center;
            background-color: rgb(247, 201, 146);
        }

        label{
            font-size: 18px;
            font-family:Arial, Helvetica, sans-serif;
        }

        input{
            margin-bottom: 5%;
        }

        button{
            background-color: rgb(247, 201, 146);
        }

        button:active{
            background-color: rgb(199, 163, 119);
        }

        input, button{
            font-size: 18px;
            font-family:Arial, Helvetica, sans-serif;
            border: white solid;
            border-radius: 20px;
        }
    </style>
</head>
<body>
    <h1>Inmobiliaria</h1>
    <form action="" id="formulario">
        
        <label for="Usuario">Usuario</label>
        <input type="text" id="Usuario" name="Usuario">

        <label for="Clave">Clave</label>
        <input type="password" id="Clave" name="Clave">

        <button type="submit">Iniciar Sesión</button>
        <p id="respuesta"></p>
    </form>

    <script>
        let formulario = document.getElementById("formulario");
        let respuesta = document.getElementById("respuesta");      

        formulario.addEventListener("submit", login);

        async function login(event){

            event.preventDefault();

            let usuario = document.getElementById("Usuario").value;
            let clave = document.getElementById("Clave").value;

            if (usuario == "" || clave == ""){
                respuesta.innerText = "Complete los datos.";
            }

            const response = await fetch('https://inmobiliariaulp-amb5hwfqaraweyga.canadacentral-01.azurewebsites.net/api/Propietarios/login', 
            {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: new URLSearchParams({ Usuario: usuario, Clave: clave })
            });

            if (!response.ok){
                alert("Usuario y/o contraseña incorrecta.");
            }
            else{
                alert("Ingreso correctamente.")
                window.location.href = "./perfil.html"
            }

            const token = await response.json;    
            localStorage.setItem("token", token);

            if (token.ok){
                alert("Login exitoso.")
            }
        }
    </script>
</body>
</html>
